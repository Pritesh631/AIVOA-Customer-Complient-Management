services:
  - type: web
    name: aivoa-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: MOCK_AI
        value: "true"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        value: sqlite:///./aivoa.db
      - key: FRONTEND_ORIGIN
        value: https://your-frontend-domain.netlify.app